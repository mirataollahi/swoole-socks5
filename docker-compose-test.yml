services:
  openvpn:
    container_name: openvpn
    image: d3vilh/openvpn-server:latest
    privileged: true
    ports:
      - "13910:13910/tcp"   # openvpn TCP port
    environment:
      TRUST_SUB: "10.0.70.0/24"
      GUEST_SUB: "10.0.71.0/24"
      HOME_SUB: "192.168.88.0/24"
    volumes:
      - ./pki:/etc/openvpn/pki
      - ./clients:/etc/openvpn/clients
      - ./config:/etc/openvpn/config
      - ./staticclients:/etc/openvpn/staticclients
      - ./log:/var/log/openvpn
      - ./fw-rules.sh:/opt/app/fw-rules.sh
      - ./checkpsw.sh:/opt/app/checkpsw.sh
      - ./server.conf:/etc/openvpn/server.conf
      - ./openvpn-logs:/var/log/openvpn
    cap_add:
      - NET_ADMIN
    restart: always
    depends_on:
      - "openvpn-ui"
    networks:
      general-network:
        ipv4_address: 172.30.10.121
    deploy:
      resources:
        limits:
          cpus: '0.6'       # Limit to 50% of one CPU
          memory: 600M      # Limit memory

  openvpn-ui:
    container_name: openvpn-ui
    image: d3vilh/openvpn-ui:latest
    environment:
      - OPENVPN_ADMIN_USERNAME=admin
      - OPENVPN_ADMIN_PASSWORD=Amir3672
    privileged: true
    ports:
      - "13900:8080/tcp"
    volumes:
      - ./:/etc/openvpn
      - ./db:/opt/openvpn-ui/db
      - ./pki:/usr/share/easy-rsa/pki
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    networks:
      general-network:
        ipv4_address: 172.30.10.120
    deploy:
      resources:
        limits:
          cpus: '0.4'       # Limit to 50% of one CPU
          memory: 400M      # Limit memory


# General docker network
networks:
  general-network:
    external: true